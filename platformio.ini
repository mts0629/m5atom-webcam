[env:m5stack-atoms3]
platform = espressif32
board = m5stack-atoms3
framework = arduino

; Enable PSRAM
board_build.arduino.memory = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi

; Enable USB CDC mode for serial logging
build_flags =
    -DARDUINO_M5STACK_ATOMS3R
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

lib_deps = m5stack/M5Unified@^0.2.23

monitor_speed = 115200
